{% extends "base.html" %}
{% block title %}Contactar Soporte{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-envelope"></i> Contactar Soporte</h1>
    <a href="{{ url_for('help_center') }}" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
</div>
<div class="card" style="max-width:600px">
    <div class="card-header"><h3>Enviar Mensaje</h3></div>
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" value="{{ current_user.username }}" disabled>
            </div>
            <div class="form-group">
                <label>Email de contacto</label>
                <input type="email" name="email" placeholder="Su email" required>
            </div>
            <div class="form-group">
                <label>Asunto</label>
                <select name="subject" required>
                    <option value="">Seleccionar...</option>
                    <option value="bug">Reportar un error</option>
                    <option value="feature">Sugerir una función</option>
                    <option value="help">Necesito ayuda</option>
                    <option value="other">Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mensaje *</label>
                <textarea name="message" rows="5" required placeholder="Describa su consulta o problema..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Enviar</button>
                <a href="{{ url_for('help_center') }}" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
