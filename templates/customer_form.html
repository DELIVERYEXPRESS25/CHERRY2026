{% extends "base.html" %}

{% block title %}{% if customer %}Editar{% else %}Agregar{% endif %} Cliente - Cherry Inventario{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-users"></i> {% if customer %}Editar{% else %}Agregar{% endif %} Cliente</h1>
    <a href="{{ url_for('customers') }}" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-group">
                <label for="name">Nombre / Razón Social *</label>
                <input type="text" id="name" name="name" value="{{ customer.name if customer else '' }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ruc">RUC / Cédula</label>
                    <input type="text" id="ruc" name="ruc" value="{{ customer.ruc if customer else '' }}">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ customer.email if customer else '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="phone" value="{{ customer.phone if customer else '' }}">
                </div>
                <div class="form-group">
                    <label for="address">Dirección</label>
                    <input type="text" id="address" name="address" value="{{ customer.address if customer else '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="credit_limit">Límite de Crédito (C$)</label>
                    <input type="number" id="credit_limit" name="credit_limit" step="0.01" min="0" value="{{ customer.credit_limit if customer else '0' }}">
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;padding-top:10px">
                        <input type="checkbox" name="is_vip" {% if customer and customer.is_vip %}checked{% endif %}> Cliente VIP
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {% if customer %}Actualizar{% else %}Guardar{% endif %}
                </button>
                <a href="{{ url_for('customers') }}" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
