{% extends "base.html" %}
{% block title %}{% if user %}Editar{% else %}Agregar{% endif %} Usuario{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-shield"></i> {% if user %}Editar{% else %}Agregar{% endif %} Usuario</h1>
    <a href="{{ url_for('users') }}" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group"><label>Usuario *</label><input type="text" name="username" value="{{ user.username if user else '' }}" required></div>
            <div class="form-group"><label>Nombre Completo *</label><input type="text" name="full_name" value="{{ user.full_name if user else '' }}" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Contraseña {% if user %}(dejar vacío para no cambiar){% endif %} *</label><input type="password" name="password" {% if not user %}required{% endif %}></div>
            <div class="form-group"><label>Rol *</label>
                <select name="role">
                    <option value="cashier" {% if user and user.role == 'cashier' %}selected{% endif %}>Cajero</option>
                    <option value="manager" {% if user and user.role == 'manager' %}selected{% endif %}>Gerente</option>
                    <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Administrador</option>
                </select>
            </div>
        </div>
        {% if user %}
        <div class="form-group"><label><input type="checkbox" name="is_active_user" {% if user.is_active_user %}checked{% endif %}> Usuario activo</label></div>
        {% endif %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
            <a href="{{ url_for('users') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div></div>
{% endblock %}
