{% extends "base.html" %}
{% block title %}{% if employee %}Editar{% else %}Agregar{% endif %} Empleado{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user"></i> {% if employee %}Editar{% else %}Agregar{% endif %} Empleado</h1>
    <a href="{{ url_for('employees') }}" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group"><label>Nombre *</label><input type="text" name="name" value="{{ employee.name if employee else '' }}" required></div>
            <div class="form-group"><label>Cargo</label><input type="text" name="position" value="{{ employee.position if employee else '' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Teléfono</label><input type="tel" name="phone" value="{{ employee.phone if employee else '' }}"></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ employee.email if employee else '' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Comisión (%)</label><input type="number" name="commission_rate" step="0.01" min="0" max="100" value="{{ employee.commission_rate if employee else '0' }}"></div>
            <div class="form-group"><label>Salario Base (C$)</label><input type="number" name="base_salary" step="0.01" min="0" value="{{ employee.base_salary if employee else '0' }}"></div>
        </div>
        <div class="form-group"><label>Fecha de Ingreso</label><input type="date" name="hire_date" value="{{ employee.hire_date.strftime('%Y-%m-%d') if employee and employee.hire_date else '' }}"></div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
            <a href="{{ url_for('employees') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div></div>
{% endblock %}
