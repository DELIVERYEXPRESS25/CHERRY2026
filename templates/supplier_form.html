{% extends "base.html" %}
{% block title %}{% if supplier %}Editar{% else %}Agregar{% endif %} Proveedor{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-truck"></i> {% if supplier %}Editar{% else %}Agregar{% endif %} Proveedor</h1>
    <a href="{{ url_for('suppliers') }}" class="btn"><i class="fas fa-arrow-left"></i> Volver</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" class="form">
        <div class="form-group"><label>Nombre *</label><input type="text" name="name" value="{{ supplier.name if supplier else '' }}" required></div>
        <div class="form-row">
            <div class="form-group"><label>Contacto</label><input type="text" name="contact_name" value="{{ supplier.contact_name if supplier else '' }}"></div>
            <div class="form-group"><label>RUC</label><input type="text" name="ruc" value="{{ supplier.ruc if supplier else '' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ supplier.email if supplier else '' }}"></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" name="phone" value="{{ supplier.phone if supplier else '' }}"></div>
        </div>
        <div class="form-group"><label>Dirección</label><input type="text" name="address" value="{{ supplier.address if supplier else '' }}"></div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
            <a href="{{ url_for('suppliers') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div></div>
{% endblock %}
